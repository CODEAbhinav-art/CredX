services:
  - type: web
    name: credx-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false        # Set this manually in Render dashboard
      - key: DATABASE_URL
        sync: false        # Set this manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: LLM_FORCE_FALLBACK
        value: false
      - key: BACKEND_CORS_ORIGIN
        value: "*"
      - key: RENDER_BACKEND_URL
        value: https://credx-backend-yfy9.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true
